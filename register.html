<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F5C3F" />
  <title>Create account · Caspian Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="body-public">
  <main class="auth-shell">
    <section class="auth-card auth-wide">
      <a class="brand" href="welcome.html">
        <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1F8A4C"/>
          <path d="M22 11.2a7.2 7.2 0 1 0 0 9.6" fill="none" stroke="#E4D2A8" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span>Caspian Bank</span>
      </a>
      <h1>Create your account</h1>
      <p class="lede">A few details and you can open your first cards.</p>
      <form id="register-form" class="form-stack mt-5" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" readonly />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <div class="phone-wrap">
            <span class="phone-prefix">+994</span>
            <input class="phone-input" id="phone" type="tel" inputmode="numeric" autocomplete="tel" data-phone placeholder="12 345 67 89" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="first-name">First name</label>
            <input class="input" id="first-name" autocomplete="given-name" />
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input class="input" id="last-name" autocomplete="family-name" />
          </div>
        </div>
        <div class="field">
          <label for="dob">Date of birth</label>
          <input class="input" id="dob" type="date" autocomplete="bday" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" data-password autocomplete="new-password" />
          <p class="field-hint">At least 8 characters, with a letter and a number.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input class="input" id="confirm" type="password" data-password autocomplete="new-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
        <a href="welcome.html">Use a different email</a>
      </form>
      <p class="auth-foot">
        <a href="contact-us.html">Contact us</a>
        <span>Caspian Bank · Baku</span>
      </p>
    </section>
  </main>
</body>
</html>
