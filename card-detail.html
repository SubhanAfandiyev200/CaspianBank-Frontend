<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F5C3F" />
  <title>Card · Caspian Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="body-app">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="app.html">
        <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1F8A4C"/>
          <path d="M22 11.2a7.2 7.2 0 1 0 0 9.6" fill="none" stroke="#E4D2A8" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span>Caspian Bank</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
      <div class="topnav-panel">
        <nav class="main-nav" aria-label="Primary">
          <a class="nav-link is-active" href="app.html">Cards</a>
          <a class="nav-link" href="transfer.html">Transfers</a>
          <a class="nav-link" href="transaction-history.html">History</a>
          <a class="nav-link" href="loan-application.html">Loans</a>
          <a class="nav-link" href="bill-payment.html">Bill Payments</a>
          <a class="nav-link" href="contact-us.html">Contact</a>
        </nav>
        <div class="nav-tools">
          <a class="btn btn-primary btn-sm" href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </header>
  <main id="content" class="page">
    <a class="back" href="app.html">All cards</a>
    <header class="page-head spread">
      <div>
        <p class="eyebrow">Card detail</p>
        <h1 id="card-heading">Card</h1>
      </div>
      <button class="btn btn-danger" type="button" id="block-open">Block this card</button>
    </header>
    <div id="card-skel" class="stack-lg">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-line"></div>
    </div>
    <div id="card-root" class="stack-lg" hidden></div>
    <div class="modal" id="block-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="block-title">
        <h2 id="block-title">Block this card?</h2>
        <p class="lede">New purchases and transfers stop immediately. Confirm with the email and password on this account.</p>
        <form id="block-form" class="form-stack" novalidate>
          <div class="field">
            <label for="block-email">Email</label>
            <input class="input" id="block-email" type="email" autocomplete="username" />
          </div>
          <div class="field">
            <label for="block-password">Password</label>
            <input class="input" id="block-password" type="password" autocomplete="current-password" />
          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" type="button" data-close-modal>Cancel</button>
            <button class="btn btn-danger" type="submit" id="block-submit">Block card</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Caspian Bank · 28 Nizami Street, Baku</span>
      <span>Personal banking</span>
    </div>
  </footer>
  <script src="assets/js/card-detail.js"></script>
</body>
</html>
