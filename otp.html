<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F5C3F" />
  <title>Verify your email · Caspian Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="body-public">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="welcome.html">
        <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1F8A4C"/>
          <path d="M22 11.2a7.2 7.2 0 1 0 0 9.6" fill="none" stroke="#E4D2A8" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span>Caspian Bank</span>
      </a>
      <h1>Verify your email</h1>
      <p class="lede" id="otp-lead">We sent a code to your email.</p>
      <form id="otp-form" class="form-stack mt-5" novalidate>
        <div class="field">
          <label for="otp-1">6-digit code</label>
          <div class="otp" data-otp>
            <input class="otp-input" id="otp-1" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1" />
            <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="otp-submit" type="submit">Verify</button>
      </form>
      <p class="hint mt-5">
        <button class="btn-link" type="button" id="resend" disabled>Resend code</button>
      </p>
      <p class="auth-foot">
        <a href="contact-us.html">Contact us</a>
        <span>Caspian Bank · Baku</span>
      </p>
    </section>
  </main>
  <script src="assets/js/otp.js"></script>
</body>
</html>
